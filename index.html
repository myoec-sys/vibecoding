  <script>
    /* Деликатные монохромные волны жидкости без ярких цветов */
    (function initSubtleLiquidCanvas() {
      const canvas = document.getElementById('ambient-canvas');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      let w, h;

      function resize() {
        w = canvas.width = window.innerWidth;
        h = canvas.height = window.innerHeight;
      }
      window.addEventListener('resize', resize);
      resize();

      // Спокойные серые капли жидкости с низким контрастом
      const drops = [
        { x: w * 0.35, y: h * 0.4, r: 260, vx: 0.2, vy: 0.15 },
        { x: w * 0.65, y: h * 0.6, r: 300, vx: -0.15, vy: -0.2 },
        { x: w * 0.5, y: h * 0.3, r: 200, vx: 0.1, vy: -0.1 }
      ];

      function loop(t) {
        ctx.clearRect(0, 0, w, h);

        drops.forEach((d, i) => {
          d.x += d.vx + Math.sin(t * 0.0005 + i) * 0.2;
          d.y += d.vy + Math.cos(t * 0.0004 + i) * 0.2;

          if (d.x < 0 || d.x > w) d.vx *= -1;
          if (d.y < 0 || d.y > h) d.vy *= -1;

          // Очень мягкий графитово-серый градиент без неонового свечения
          const grad = ctx.createRadialGradient(d.x, d.y, 0, d.x, d.y, d.r);
          grad.addColorStop(0, 'rgba(255, 255, 255, 0.045)');
          grad.addColorStop(1, 'rgba(9, 9, 11, 0)');

          ctx.fillStyle = grad;
          ctx.beginPath();
          ctx.arc(d.x, d.y, d.r, 0, Math.PI * 2);
          ctx.fill();
        });

        requestAnimationFrame(loop);
      }
      requestAnimationFrame(loop);
    })();

    /* Копирование ссылки */
    (function initCopyAction() {

            toast.classList.add('translate-y-16', 'opacity-0');
            copyBtnText.textContent = 'Скопировать ссылку';
          }, 2000);
        } catch (e) {
          // Игнорируем ошибку
        }
        document.body.removeChild(input);
      });
    })();
